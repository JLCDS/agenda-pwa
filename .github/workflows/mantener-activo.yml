name: Mantener Supabase activo

# El plan gratis pausa los proyectos sin actividad. Una consulta cada 3 días lo evita.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail --silent --show-error -o /dev/null "$URL/rest/v1/tareas?select=id&limit=1" -H "apikey: $CLAVE"
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          CLAVE: ${{ vars.VITE_SUPABASE_ANON_KEY }}
